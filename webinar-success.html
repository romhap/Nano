    <style>
        .success-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px}

<body>

    <!--
    ============================================================
    ONE THING TO FILL IN BELOW: the Zoom link.

    Recommended: schedule the meeting with "Registration Required" +
    Automatic Approval turned on, then paste the REGISTRATION page URL
    here (not a raw join link) — Zoom emails each person who registers
    their own personal join link automatically, no manual work for you.

    Find the line below that says PASTE_YOUR_ZOOM_LINK_HERE and replace

    ============================================================
    -->

    <section class="success-page">
        <div class="success-wrap">
            <div class="success-check">✓</div>
            <h3>You're registered.</h3>

            <a href="PASTE_YOUR_ZOOM_LINK_HERE" class="btn btn-primary btn-full" target="_blank" rel="noopener">
                Join on Zoom →
            </a>
            <p class="success-small">Save this link — you'll need it to join the live session. We'll also see you there.</p>
            <p class="success-small" style="margin-top:24px"><a href="index.html" style="color:var(--text-muted)">← Back to IMAT.club</a></p>
        </div>
    </section>

    <script>
        // Stops the homepage webinar popup from nagging someone who already paid
        try { localStorage.setItem('imat_webinar_registered', 'true'); } catch (e) {}
    </script>
