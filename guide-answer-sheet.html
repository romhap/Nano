<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
    --bg:#FFFFFF;--bg2:#F5F5F5;--card:#FFFFFF;
    --text:#0A0A0A;--text2:#666;--text3:#999;
    --border:#E0E0E0;--border2:#EEEEEE;
    --accent:#0047FF;
    --red:#D42020;--radius:4px;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased}

.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,0.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:640px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:8px}
.nav-inner .brand-icon{height:26px;width:26px;flex-shrink:0}
.nav-inner .brand-text{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:-.02em;color:var(--text);text-decoration:none}

.wrap{max-width:420px;margin:0 auto;padding:160px 24px 60px}

.fields{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.fld{padding:13px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Inter',sans-serif;font-size:.88rem;width:100%;transition:border-color .15s}
.fld:focus{outline:none;border-color:var(--accent)}
.fld::placeholder{color:var(--text3)}

.ig-row{display:flex;align-items:flex-start;gap:10px;margin:14px 2px 4px;cursor:pointer}
.ig-row input[type="checkbox"]{width:16px;height:16px;flex-shrink:0;margin-top:2px;accent-color:var(--accent)}
.ig-text{font-size:.82rem;color:var(--text2);line-height:1.5}
.ig-text a{color:var(--accent);font-weight:600;text-decoration:none}
.ig-text a:hover{text-decoration:underline}

.btn{width:100%;padding:14px;background:var(--text);color:var(--bg);border:none;border-radius:var(--radius);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:opacity .15s;margin-top:16px}
.btn:hover{opacity:.85}
.msg{font-size:.8rem;margin-top:12px;min-height:1.2em;text-align:center}
.msg.err{color:var(--red)}
.msg.ok{color:var(--accent)}
.consent{font-size:.68rem;color:var(--text3);margin-top:18px;line-height:1.5;text-align:center}
</style>
</head>
<body>

<nav class="nav">
    <div class="nav-inner">
        <a href="index.html" style="display:flex;align-items:center;gap:8px;text-decoration:none">
            <svg class="brand-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
                <path d="M8 46 Q8 22 32 20 Q56 22 56 46" stroke="#0047FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M23 46 L23 36 Q23 30 32 30 Q41 30 41 36 L41 46" fill="#fff" stroke="#0047FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="6" y="46" width="52" height="4" rx="2" fill="#0047FF"/>
            </svg>
            <span class="brand-text">IMAT.club</span>
        </a>
    </div>
</nav>

<div class="wrap">
    <div class="fields">
        <input type="email" id="gEmail" placeholder="Your email" class="fld">
    </div>

    <label class="ig-row">
        <input type="checkbox" id="gFollow">
        <span class="ig-text">I follow <a href="https://www.instagram.com/mayashakked/" target="_blank" rel="noopener">@mayashakked</a> on Instagram</span>
    </label>

    <button class="btn" id="gBtn">Download</button>
    <p class="msg" id="gMsg"></p>
    <p class="consent">Your email is stored to deliver this file and to email you about the mentorship. Unsubscribe anytime.</p>
</div>

<script>
const SIGNUP_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwszZzQywosaVON0oalp_CzcfYwMjWI5hP6Kuj4gBsMmfBHj-y4Z85uz7EzIqnFDuFeIw/exec';
const FILE_URL = 'products/IMAT-Answer-Sheet.pdf';
const SOURCE = 'guide_answer_sheet';

function track(name, data) {
    try { window.va && window.va('event', { name: name, data: data || {} }); } catch (e) {}
}

function reportSignup(payload) {
    if (!SIGNUP_ENDPOINT) return;
    try {
        new Image().src = SIGNUP_ENDPOINT + '?data=' + encodeURIComponent(JSON.stringify(payload));
    } catch (e) {}
}

// Triggers a real file download without navigating the page away from the
// form -- an <a download> click does this natively in every modern browser.
function triggerDownload(url) {
    const a = document.createElement('a');
    a.href = url;
    a.download = '';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

document.getElementById('gBtn').addEventListener('click', submitGate);
document.getElementById('gEmail').addEventListener('keydown', e => { if (e.key === 'Enter') submitGate(); });

function submitGate() {
    const email = document.getElementById('gEmail').value.trim().toLowerCase();
    const follows = document.getElementById('gFollow').checked;
    const msg = document.getElementById('gMsg');

    if (!email || !email.includes('@')) { msg.textContent = 'Enter a valid email.'; msg.className = 'msg err'; return; }
    if (!follows) { msg.textContent = 'Please confirm you follow @mayashakked to download.'; msg.className = 'msg err'; return; }

    reportSignup({
        source: SOURCE,
        email: email,
        user_agent: navigator.userAgent
    });
    track('guide_download', { source: SOURCE });

    triggerDownload(FILE_URL);
    msg.textContent = 'Downloaded.';
    msg.className = 'msg ok';
}
</script>

</body>
</html>
