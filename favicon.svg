<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#0A0A0A"/>
  <!-- Igloo: snow-block dome with a rounded entrance tunnel -->
  <path d="M8 46 Q8 22 32 20 Q56 22 56 46" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Snow-block courses -->
  <path d="M12 46 Q32 40 52 46" fill="none" stroke="#fff" stroke-width="2" opacity="0.55"/>
  <path d="M10 38 Q32 32 54 38" fill="none" stroke="#fff" stroke-width="2" opacity="0.55"/>
  <path d="M14 30 Q32 25 50 30" fill="none" stroke="#fff" stroke-width="2" opacity="0.55"/>
  <!-- Vertical block seams -->
  <path d="M20 44 L20 33 M27 46 L27 30 M37 46 L37 30 M44 44 L44 33" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <!-- Entrance tunnel -->
  <path d="M23 46 L23 36 Q23 30 32 30 Q41 30 41 36 L41 46" fill="#0A0A0A" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ground line -->
  <rect x="6" y="46" width="52" height="3" fill="#fff"/>
  <!-- Blue accent line -->
  <rect x="0" y="58" width="64" height="4" fill="#0047FF"/>
</svg>
